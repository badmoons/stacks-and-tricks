<!DOCTYPE html>
<head>
  <meta></meta>
  <title>Stacks and Tricks</title>
</head>

<body>
  <script src="index.js"></script>

  <h1>Smol vm</h1>

  <p><a href="./examples.html"><b>Examples</b></a></p>
  <p><a href="./tutorial.html"><b>Short tutorial</b></a></p>

  <h3>Asm input</h3>
  <textarea id="asmInput" rows="25" cols="45" placeholder="code goes here"/></textarea>
  <button id="runAsmButton">Run asm</button>

  <div>
    <p><b>Output</b></p><button id="clearOut">Clear</button>
<pre>
<code id="output">
</code>
</pre>
  </div>

  <script>
    const asmInput = document.querySelector("#asmInput");
    const runButton = document.querySelector("#runAsmButton");
    const clearOut = document.querySelector("#clearOut");

    runButton.addEventListener("click", () => {
	const text = asmInput.value;
	main(text);
    });

    clearOut.addEventListener("click", () => {
        let out = document.getElementById("output");
        out.textContent = "";
    });
  </script>
</body>
