<!DOCTYPE html>
<head>
  <meta></meta>
  <title>Stacks and Tricks</title>
</head>

<body>
  <script src="index.js"></script>

  <h1>Smol vm</h1>

  <p><a href="./examples.html"><b>Examples</b></a></p>
  <p><a href="./tutorial.html"><b>Tutorial</b></a></p>

  <h3>Asm input</h3>
  <div>
    <button id="runAsmButton">Run asm</button>
  </div>

  <div>
    <label for="debugOn">Enable Console Debug/Dissasembler</label>
    <input type="checkbox" class="debugOn" value="false"/>
  </div>

  <div>
    <textarea id="asmInput" rows="25" cols="45" placeholder="code goes here"/></textarea>
  </div>
  <div>
    <p><b>Output</b></p><button id="clearOut">Clear</button>
<pre>
<code id="output">
</code>
</pre>
  </div>

  <script>
    // this is sort of our 'main' but for the browser, I am hoping I'll have the time to make a console/desktop version of the machine or more
    const asmInput = document.querySelector("#asmInput");
    const runButton = document.querySelector("#runAsmButton");
    const clearOut = document.querySelector("#clearOut");

    runButton.addEventListener("click", () => {
	const text = asmInput.value;
	const debugOn = document.querySelector('.debugOn').checked;
	main(text, debugOn);
    });

    clearOut.addEventListener("click", () => {
        let out = document.getElementById("output");
        out.textContent = "";
    });
  </script>
</body>
